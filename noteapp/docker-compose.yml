services:
  web:
    build: .
    environment:
      DATABASE_URL: postgres://noteapp:noteapp@database:5432/noteapp
      READY_AFTER_SECONDS: "15"
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: noteapp
      POSTGRES_PASSWORD: noteapp
      POSTGRES_DB: noteapp
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteapp -d noteapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database:
